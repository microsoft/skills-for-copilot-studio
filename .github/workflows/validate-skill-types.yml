name: Validate skill agent-types

on:
  pull_request:
    paths:
      - 'skills/*/SKILL.md'
      - 'hooks/skill-types.json'
      - 'scripts/build-skill-filter.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all skills have agent-types and JSON is up to date
        run: |
          ERRORS=0

          # Check 1: every skill must have agent-types frontmatter
          for dir in skills/*/; do
            skill_name=$(basename "$dir")
            skill_file="$dir/SKILL.md"
            [ -f "$skill_file" ] || continue
            case "$skill_name" in int-*) continue ;; esac

            agent_types=$(head -20 "$skill_file" | grep "^agent-types:" | sed 's/agent-types: *//')
            if [ -z "$agent_types" ]; then
              echo "::error::Skill '$skill_name' is missing agent-types in SKILL.md frontmatter. Add 'agent-types: classic', 'agent-types: modern', or 'agent-types: both'."
              ERRORS=1
            fi
          done

          # Check 2: committed skill-types.json matches build output
          cp hooks/skill-types.json /tmp/skill-types-committed.json
          node scripts/build-skill-filter.js
          if ! diff -q hooks/skill-types.json /tmp/skill-types-committed.json > /dev/null 2>&1; then
            echo "::error::hooks/skill-types.json is out of date. Run 'node scripts/build-skill-filter.js' and commit the result."
            diff hooks/skill-types.json /tmp/skill-types-committed.json || true
            ERRORS=1
          fi

          if [ "$ERRORS" -eq 1 ]; then
            exit 1
          fi

          echo "All skills have agent-types and skill-types.json is up to date."
